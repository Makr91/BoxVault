<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <meta charset="utf-8" />
    <!--
      Runs synchronously during parsing, before first paint, so the page never
      renders in the wrong colour scheme. It MUST resolve the preference in the
      same order App.jsx does at mount — account, then this browser, then the
      operating system — because reading only local storage would move the flash
      onto exactly the users whose two values disagree rather than removing it.
      Keep the two in step, and keep this in <head> ahead of any stylesheet.
    -->
    <script>
      (function () {
        try {
          var session = JSON.parse(localStorage.getItem('user') || 'null');
          var preference =
            (session && session.preferredTheme) || localStorage.getItem('theme') || 'auto';
          var resolved =
            preference === 'auto'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light'
              : preference;
          document.documentElement.setAttribute('data-bs-theme', resolved);
          var lang = localStorage.getItem('i18nextLng');
          if (lang) {
            document.documentElement.lang = lang;
          }
        } catch (error) {
          document.documentElement.setAttribute('data-bs-theme', 'light');
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" type="image/x-icon" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="BoxVault -- BoxVault Web administrator panel" />
    <title>BoxVault</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/main.jsx"></script>
  </body>
</html>

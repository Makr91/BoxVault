schemaVersion: 1
boxvault:
  box_storage_directory: /mnt/g/Projects/BoxVault/backend/tests/__test_storage__
  box_max_file_size: 1
  origin: http://localhost:3000
  api_url: http://localhost:3000/api
  api_listen_port_unencrypted: 5001
  api_listen_port_encrypted: 5002
ticket_system:
  enabled: true
  base_url: https://example.com/ticket
ssl:
  generate_ssl: false
logging:
  level: error
  console_enabled: true
  log_directory: /mnt/g/Projects/BoxVault/backend/tests/__test_logs__
rate_limiting:
  window_minutes: 15
  max_requests: 1000000
  file_operations_max_requests: 1000000
  download_max_requests: 1000000
  download_link_max_requests: 1000000
  architecture_operations_max_requests: 1000000
  auth_max_requests: 1000000
sites:
  downloads.test:
    brand:
      name: Test Downloads
      logo_url: /brand/test.svg
      default_theme: dark
      pack:
        name: testpack
        css: /themes/testpack/testpack.css?v=abc
    collections:
      - downloads
    links:
      docs: https://docs.test
      contact: help@test
  face.test:
    collections:
      - downloads
    features:
      - admin
      - discover
      - uploads
      - watches
      - favorites
      - notifications
      - health
      - search
      - events
    origin: https://face.test

schemaVersion: 1
boxvault:
  origin: http://localhost:5000
  upload_timeout_hours: 24
  download_timeout_hours: 24
  api_url: https://your-domain.com/api
  api_listen_port_unencrypted: 80
  api_listen_port_encrypted: 443
  box_storage_directory: /var/lib/boxvault/storage
  box_max_file_size: 10
  iso_storage_directory: ''
  repository_packages_url: ''
  trust_proxy: true
  org_code_seed: B00000
  allowed_origins: []
gravatar:
  base_url: https://api.gravatar.com/v3/profiles/
  api_key: dfasfdfsdfdsafsa
ticket_system:
  enabled: true
  base_url: https://xd.prominic.net/app/apprequest.nsf/router?openagent
  req_type: sso
  context: https://github.com/Makr91/BoxVault
ssl:
  generate_ssl: true
  cert_path: /etc/boxvault/ssl/public.crt
  key_path: /etc/boxvault/ssl/private.key
logging:
  level: info
  console_enabled: true
  log_directory: /var/log/boxvault
  performance_threshold_ms: 1000
  enable_compression: true
  compression_age_days: 7
  max_files: 30
  categories:
    app: info
    api: info
    database: warn
    auth: info
    file: info
frontend_logging:
  enabled: true
  level: info
  categories:
    app: info
    auth: info
    api: info
    file: info
    component: debug
monitoring:
  disk_space_warning_threshold: 90
  disk_space_critical_threshold: 95
  alert_frequency_hours: 24
rate_limiting:
  window_minutes: 15
  max_requests: 100
  message: Too many requests from this IP, please try again later.
  skip_successful_requests: false
  skip_failed_requests: false
notifications:
  enabled: true
  vapid_subject: mailto:admin@localhost
  vapid_public_key: ''
  vapid_private_key: ''
